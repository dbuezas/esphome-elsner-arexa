# Elsner Arexa window control on an ESP8266 (D1 mini) with a CC1101 868 MHz module.
# Wiring: CC1101 SCK -> D5, MISO -> D6, MOSI -> D7, CSN -> D8, GDO0 -> D2, VCC -> 3.3 V, GND -> GND.

esphome:
  name: arexa

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
api:
ota:
  - platform: esphome

external_components:
  - source: github://dbuezas/esphome-elsner-arexa
    components: [elsner_arexa, cc1101]  # cc1101: my copy of the driver, reads packets longer than the FIFO

spi:
  clk_pin: D5
  miso_pin: D6
  mosi_pin: D7

# packet mode needs gdo0_pin and packet_length (any value); elsner_arexa sets all the radio settings itself
cc1101:
  - id: radio_arexa
    cs_pin: D8
    gdo0_pin: D2
    packet_mode: true
    packet_length: 64

elsner_arexa:
  cc1101_id: radio_arexa
  # frequency: 868.19MHz  # 868.19 MHz + your module's error (cheap modules: +-40 kHz)
  # system: auto          # or the 18 hex digits of the "Arexa System" text sensor, to skip the learning

sensor:
  - platform: elsner_arexa
    inside_temperature:
      name: Arexa Inside Temperature
    outside_temperature:
      name: Arexa Outside Temperature
    wind:
      name: Arexa Wind
    brightness:
      name: Arexa Brightness
    rain_sensor:
      name: Arexa Rain Sensor
    rc_rssi:
      name: Arexa RC Signal
    station_rssi:
      name: Arexa Station Signal
    rc_freq_offset:
      name: Arexa RC Frequency Offset
    station_freq_offset:
      name: Arexa Station Frequency Offset

binary_sensor:
  - platform: elsner_arexa
    rain:
      name: Arexa Rain
    wind_alarm:
      name: Arexa Wind Alarm
    auto_mode:
      name: Arexa Auto Mode

switch:
  - platform: elsner_arexa
    auto_mode:
      name: Arexa Automatic

button:
  - platform: elsner_arexa
    open:
      name: Arexa Open
    stop:
      name: Arexa Stop
    down:
      name: Arexa Down
    auto:
      name: Arexa Auto
    manual:
      name: Arexa Manual

event:
  - platform: elsner_arexa
    remote:
      name: Arexa Remote

text_sensor:
  - platform: elsner_arexa
    system:
      name: Arexa System
    station_raw:
      name: Arexa Station Raw
    last_command:
      name: Arexa Last Command
